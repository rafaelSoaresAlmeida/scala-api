# https://www.playframework.com/documentation/latest/Configuration

# Default database configuration
slick.dbs.default.driver="slick.driver.H2Driver$"
slick.dbs.default.db.driver="org.h2.Driver"
slick.dbs.default.db.url="jdbc:h2:mem:play"

# Habilita a execução automática dos scripts SQL ao iniciar
play.evolutions.db.default.autoApply = true

play.http.errorHandler = "exception.ErrorHandler"

jwt {
  secret = "sua-chave-secreta-super-segura-com-pelo-menos-32-caracteres-batata"
  secret = ${?JWT_SECRET}
  expirationSeconds = 3600 // 1 hora
}

# 1. Enable the Swagger Module
play.modules.enabled += "play.modules.swagger.SwaggerModule"

# 2. Set the URL Base Path (Must be a valid URL/path, not a Scala package)
swagger.api.basepath = "http://localhost:8080"

# 3. Specify the Scala packages to scan (if using a scanner config / play-swagger)
swagger.scanner.packages = ["controllers", "docs"]
# Or for Swagger Core / OpenAPI 3.0 integrations:
swagger.api.scanner.packages = ["controllers"]